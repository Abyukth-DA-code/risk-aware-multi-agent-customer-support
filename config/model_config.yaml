# Model Training and Architecture Configurations
# Version: 4.0 Clean Canonical

models:
  intent_classifier:
    task: "multi_class_text_classification"
    num_classes: 47
    supported_domains: ["E-commerce", "Education", "Small Business"]
    baseline:
      architecture: "TF-IDF + LinearSVC / LogisticRegression"
      ngram_range: [1, 2]
      max_features: 10000
    neural:
      base_model: "sentence-transformers/all-MiniLM-L6-v2"
      max_seq_length: 128
      batch_size: 32
      learning_rate: 2.0e-5
      epochs: 5

  sentiment_analyzer:
    task: "sentiment_classification"
    classes: ["Negative", "Neutral", "Positive"]
    baseline:
      architecture: "VADER / RoBERTa-sentiment"
    neural:
      base_model: "distilbert-base-uncased-finetuned-sst-2-english"
      batch_size: 32

  risk_classifier:
    task: "ordinal_multi_class"
    classes: ["Low", "Medium", "High", "Critical"]
    baseline:
      architecture: "RandomForest / XGBoost"
      features:
        - query_embedding
        - sensitive_action
        - financial_impact
        - action_type
        - domain

  complexity_classifier:
    task: "multi_class"
    classes: ["Low", "Medium", "High"]
    baseline:
      architecture: "LightGBM / SentenceTransformer + RidgeClassifier"

  rag_retrieval:
    dense_model: "sentence-transformers/all-MiniLM-L6-v2"
    sparse_model: "BM25Okapi"
    hybrid_alpha: 0.60
    top_k: 3
    reranker: "cross-encoder/ms-marco-MiniLM-L-6-v2"
